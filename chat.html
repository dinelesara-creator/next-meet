<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:Poppins;
background:black;
}

/* VIDEO BACKGROUND */

#bg-video{
position:fixed;
right:0;
bottom:0;
min-width:100%;
min-height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.35) saturate(1.4);
}

/* DARK OVERLAY */

.overlay{
position:fixed;
inset:0;
background:
linear-gradient(
135deg,
rgba(15,0,20,0.85),
rgba(45,0,45,0.75),
rgba(0,0,0,0.9)
);
z-index:-1;
}

/* NAVBAR */

nav{
height:75px;
display:flex;
justify-content:center;
align-items:center;
gap:18px;
backdrop-filter:blur(20px);
background:rgba(255,255,255,0.04);
border-bottom:1px solid rgba(255,255,255,0.08);
}

nav a{
text-decoration:none;
color:#ffb3c1;
padding:12px 22px;
border-radius:40px;
transition:0.4s;
font-size:15px;
letter-spacing:1px;
}

nav a:hover{
background:linear-gradient(135deg,#ff0066,#ff4d88);
color:white;
transform:translateY(-2px);
box-shadow:0 0 25px rgba(255,0,102,0.5);
}

/* MAIN CHAT */

.chat-wrapper{
height:calc(100vh - 75px);
display:flex;
flex-direction:column;
padding:20px;
}

/* HEADER */

.chat-header{
display:flex;
align-items:center;
gap:15px;
padding:18px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-radius:25px;
border:1px solid rgba(255,255,255,0.08);
margin-bottom:18px;
box-shadow:0 0 30px rgba(255,0,102,0.15);
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(135deg,#ff0066,#ff4d88);
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
box-shadow:0 0 25px rgba(255,0,102,0.5);
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.chat-title{
color:white;
font-size:22px;
font-weight:600;
}

.chat-sub{
color:#ffb3c1;
font-size:13px;
margin-top:4px;
}

/* CHAT AREA */

.chat-area{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:14px;
scroll-behavior:smooth;
}

/* MESSAGE */

.message{
max-width:72%;
padding:15px 20px;
border-radius:25px;
color:white;
font-size:15px;
line-height:1.6;
animation:msgAnim 0.3s ease;
backdrop-filter:blur(10px);
position:relative;
}

.mine{
align-self:flex-end;
background:linear-gradient(135deg,#ff0066,#ff4d88);
box-shadow:0 0 25px rgba(255,0,102,0.3);
}

.her{
align-self:flex-start;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.08);
}

@keyframes msgAnim{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* INPUT AREA */

.input-area{
display:flex;
align-items:center;
gap:12px;
padding:18px;
background:rgba(255,255,255,0.05);
border-radius:25px;
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.08);
margin-top:12px;
}

.input-area input{
flex:1;
padding:16px 20px;
border:none;
outline:none;
border-radius:20px;
background:rgba(255,255,255,0.07);
color:white;
font-size:15px;
}

.input-area input::placeholder{
color:rgba(255,255,255,0.4);
}

.send-btn{
padding:16px 24px;
border:none;
border-radius:20px;
background:linear-gradient(135deg,#ff0066,#ff4d88);
color:white;
font-weight:bold;
cursor:pointer;
transition:0.4s;
font-size:15px;
}

.send-btn:hover{
transform:scale(1.05);
box-shadow:0 0 30px rgba(255,0,102,0.5);
}

/* FLOATING HEARTS */

.heart{
position:fixed;
font-size:20px;
animation:floatHeart linear infinite;
opacity:0.5;
}

@keyframes floatHeart{
0%{
transform:translateY(100vh) scale(0.5);
opacity:0;
}
50%{
opacity:0.7;
}
100%{
transform:translateY(-120px) scale(1.2);
opacity:0;
}
}

/* TOOLS */

.tool-btn{
width:52px;
height:52px;
border:none;
border-radius:50%;
background:rgba(255,255,255,0.08);
color:white;
font-size:20px;
cursor:pointer;
transition:0.3s;
backdrop-filter:blur(10px);
}

.tool-btn:hover{
transform:scale(1.08);
background:linear-gradient(135deg,#ff0066,#ff4d88);
}

/* EMOJI BOX */

.emoji-box{
position:absolute;
bottom:95px;
left:20px;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(20px);
padding:15px;
border-radius:20px;
display:none;
gap:10px;
flex-wrap:wrap;
width:320px;
border:1px solid rgba(255,255,255,0.08);
}

.emoji-box span{
font-size:28px;
cursor:pointer;
transition:0.3s;
}

.emoji-box span:hover{
transform:scale(1.25);
}

/* IMAGE MESSAGE */

.chat-image{
width:240px;
border-radius:20px;
margin-top:8px;
}

/* TIME */

.msg-time{
font-size:11px;
margin-top:8px;
opacity:0.7;
text-align:right;
}

/* STATUS */

.top-status{
position:absolute;
top:88px;
right:25px;
color:#00ff99;
font-size:13px;
letter-spacing:1px;
}

/* TYPING */

.typing{
font-size:13px;
color:#ffb3c1;
padding-left:12px;
margin-top:5px;
display:none;
}

/* AUDIO */

audio{
width:230px;
margin-top:10px;
}

/* DELETE */

.delete-btn{
margin-top:8px;
font-size:12px;
opacity:0.7;
cursor:pointer;
}

.delete-btn:hover{
color:#ff4d88;
}

/* FLOATING BACKGROUND */

.floating-bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,0,102,0.12),transparent 25%),
radial-gradient(circle at 80% 40%,rgba(255,77,136,0.12),transparent 25%),
radial-gradient(circle at 50% 80%,rgba(255,0,255,0.08),transparent 30%);
animation:bgMove 12s linear infinite;
z-index:-1;
}

@keyframes bgMove{
0%{
transform:translateY(0px);
}
50%{
transform:translateY(-25px);
}
100%{
transform:translateY(0px);
}
}


/* REACTION BAR */

.reaction-bar{
display:flex;
gap:8px;
margin-top:6px;
padding-left:10px;
align-items:center;
flex-wrap:wrap;
}

/* REACTION BUTTON */

.react-btn{
width:34px;
height:34px;
border-radius:50%;
border:none;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
font-size:16px;
cursor:pointer;
transition:0.3s;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.react-btn:hover{
transform:scale(1.15);
background:linear-gradient(135deg,#ff0066,#ff4d88);
box-shadow:0 0 20px rgba(255,0,102,0.4);
}

/* REACTION RESULT */

.reaction-result{
display:flex;
gap:5px;
margin-top:5px;
padding-left:10px;
flex-wrap:wrap;
}

.reaction-badge{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
padding:5px 10px;
border-radius:20px;
font-size:14px;

}

@keyframes popReact{
0%{
transform:scale(0.5);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

/* DOUBLE TICKS */

opacity:0.7;
margin-bottom:6px;
padding-bottom:5px;
border-bottom:1px solid rgba(255,255,255,0.1);

</style>

<script>
if(!sessionStorage.getItem("verified")){
window.location.href="index.html";
}

/*
 * CROSS-DEVICE CHAT STORAGE
 * --------------------------
 * This chat previously used localStorage. localStorage belongs to one
 * browser/device, so it cannot sync messages to another device.
 *
 * 1) Create a Firebase project.
 * 2) Enable Realtime Database.
 * 3) Enable Authentication -> Sign-in method -> Anonymous.
 * 4) Paste your Firebase web-app configuration below.
 *
 * The same CHAT_ROOM value must be used on both devices.
 */

const firebaseConfig = {
  apiKey: "PASTE_YOUR_FIREBASE_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://PASTE_YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "PASTE_YOUR_PROJECT",
  storageBucket: "PASTE_YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
  appId: "PASTE_YOUR_FIREBASE_APP_ID"
};

const CHAT_ROOM = "private-love-chat";
const CLOUD_CONFIGURED =
  firebaseConfig.apiKey !== "PASTE_YOUR_FIREBASE_API_KEY" &&
  firebaseConfig.databaseURL !== "https://PASTE_YOUR_PROJECT-default-rtdb.firebaseio.com";

let db = null;
let currentUser = null;
let messagesRef = null;
let cloudReady = false;
let renderingCloudMessages = false;

const msgInput=document.getElementById("msg");

msgInput.addEventListener("input",()=>{
document.getElementById("typing").style.display="block";
clearTimeout(window.typingTimer);
window.typingTimer=setTimeout(()=>{
document.getElementById("typing").style.display="none";
},1000);
});

/* ---------------- CLOUD INITIALIZATION ---------------- */

async function initCloudChat(){

  if(!CLOUD_CONFIGURED){
    console.warn("Firebase is not configured. Cross-device chat is disabled.");
    loadLocalFallback();
    return;
  }

  try{
    if(!firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
    }

    db=firebase.database();

    await firebase.auth().signInAnonymously();
    currentUser=firebase.auth().currentUser;

    messagesRef=db.ref("loveChats/"+CHAT_ROOM+"/messages");
    cloudReady=true;

    /*
     * First migrate messages that were previously stored on THIS device.
     * Only migrate when the shared room is empty, preventing duplicates.
     */
    const snapshot=await messagesRef.once("value");

    if(!snapshot.exists()){
      await migrateOldLocalMessages();
    }

    /*
     * Realtime listener:
     * every message added/changed/deleted in Firebase is reflected here.
     */
    messagesRef.on("value",renderCloudMessages);

  }catch(error){
    console.error("Firebase chat initialization failed:",error);
    loadLocalFallback();
  }
}

/* ---------------- SEND MESSAGE ---------------- */

function sendMsg(){

  const text=msgInput.value.trim();

  if(text==="") return;

  createMessage(text,"mine");

  msgInput.value="";
}

/* ---------------- CREATE MESSAGE ---------------- */

function createMessage(content,type="mine",extra={}){

  const time=new Date().toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });

  const messageData={
    content:content,
    type:type,
    time:time,
    createdAt:firebaseReadyNow(),
    senderId:currentUser ? currentUser.uid : "local-device",
    reply:extra.reply || "",
    reactions:extra.reactions || {}
  };

  if(cloudReady && messagesRef){

    messagesRef.push(messageData)
      .catch(error=>{
        console.error("Message could not be saved:",error);
        addLocalMessage(messageData);
      });

  }else{
    addLocalMessage(messageData);
  }

  scrollBottom();

  notify("New lovely message 💕");

  replyText="";
  msgInput.placeholder="Leave your message here";
}

/*
 * Firebase server timestamp is used when possible.
 * For old/local messages we use the browser timestamp.
 */
function firebaseReadyNow(){
  return (window.firebase && firebase.database.ServerValue)
    ? firebase.database.ServerValue.TIMESTAMP
    : Date.now();
}

/* ---------------- RENDER CLOUD MESSAGES ---------------- */

function renderCloudMessages(snapshot){

  const area=document.getElementById("chatArea");
  const messages=[];

  snapshot.forEach(child=>{
    messages.push({
      key:child.key,
      data:child.val()
    });
  });

  messages.sort((a,b)=>{
    const at=typeof a.data.createdAt==="number" ? a.data.createdAt : 0;
    const bt=typeof b.data.createdAt==="number" ? b.data.createdAt : 0;
    return at-bt;
  });

  renderingCloudMessages=true;
  area.innerHTML="";

  messages.forEach(item=>{
    renderStoredMessage(item.key,item.data);
  });

  renderingCloudMessages=false;

  localStorage.setItem("loveChat",area.innerHTML);
  scrollBottom();
}

/* ---------------- RENDER ONE STORED MESSAGE ---------------- */

function renderStoredMessage(key,data){

  const div=document.createElement("div");
  const senderId=data.senderId || "";

  /*
   * Messages from this browser's Firebase anonymous account are "mine".
   * Messages from another device/account are shown on the other side.
   */
  const visualType =
    senderId && currentUser && senderId===currentUser.uid
      ? "mine"
      : (data.type==="mine" ? "her" : data.type || "her");

  div.className=`message ${visualType}`;
  div.dataset.messageKey=key;

  const replyHtml=data.reply
    ? `<div class="reply-box">${escapeHtml(data.reply)}</div>`
    : "";

  const contentHtml=data.content || "";

  const reactions=data.reactions || {};
  const reactionHtml=Object.values(reactions)
    .map(r=>`<div class="reaction-badge">${escapeHtml(String(r))}</div>`)
    .join("");

  div.innerHTML=`

${replyHtml}

<div ondblclick="replyMessage(this.innerText)">
${contentHtml}
</div>

<div class="msg-time">
${escapeHtml(data.time || "")}
<span class="ticks">✓✓</span>
</div>

<div class="reaction-bar">

<button class="react-btn" onclick="addReaction(this,'❤️')">❤️</button>
<button class="react-btn" onclick="addReaction(this,'😍')">😍</button>
<button class="react-btn" onclick="addReaction(this,'🔥')">🔥</button>
<button class="react-btn" onclick="addReaction(this,'😘')">😘</button>

</div>

<div class="reaction-result">${reactionHtml}</div>

<div class="delete-btn" onclick="deleteMsg(this)">
Delete
</div>
`;

  document.getElementById("chatArea").appendChild(div);
}

/* ---------------- DELETE ---------------- */

function deleteMsg(el){

  const message=el.closest(".message");
  if(!message) return;

  const key=message.dataset.messageKey;

  if(cloudReady && key){

    messagesRef.child(key).remove()
      .catch(error=>{
        console.error("Could not delete message:",error);
      });

  }else{
    message.remove();
    saveChat();
  }
}

/* ---------------- LOCAL FALLBACK/CACHE ---------------- */

function saveChat(){

  /*
   * Keep a browser cache too. This is NOT the cross-device database;
   * Firebase is the source of truth when configured.
   */
  localStorage.setItem(
    "loveChat",
    document.getElementById("chatArea").innerHTML
  );
}

function loadLocalFallback(){

  const saved=localStorage.getItem("loveChat");

  if(saved){
    document.getElementById("chatArea").innerHTML=saved;
  }

  scrollBottom();
}

function addLocalMessage(data){

  const key="local-"+Date.now()+"-"+Math.random().toString(36).slice(2);

  renderStoredMessage(key,data);
  saveChat();
  scrollBottom();
}

/* ---------------- MIGRATE OLD LOCAL HISTORY ---------------- */

async function migrateOldLocalMessages(){

  const saved=localStorage.getItem("loveChat");

  if(!saved || !messagesRef) return;

  const parser=new DOMParser();
  const doc=parser.parseFromString(saved,"text/html");
  const oldMessages=[...doc.querySelectorAll(".message")];

  if(!oldMessages.length) return;

  const updates={};

  oldMessages.forEach((old,index)=>{

    const clone=old.cloneNode(true);

    /*
     * Delete controls are UI only and should not be stored as message content.
     */
    clone.querySelectorAll(".delete-btn").forEach(el=>el.remove());

    const timeElement=clone.querySelector(".msg-time");

    const time=timeElement
      ? timeElement.childNodes[0]?.textContent?.trim() || ""
      : "";

    const type=old.classList.contains("mine") ? "mine" : "her";

    updates["migration-"+Date.now()+"-"+index]={
      content:clone.innerHTML,
      type:type,
      time:time,
      createdAt:Date.now()+index,
      senderId: type==="mine"
        ? (currentUser ? currentUser.uid : "local-device")
        : "previous-device",
      reply:""
    };
  });

  await messagesRef.update(updates);
}

/* ---------------- VOICE ---------------- */

let mediaRecorder;
let audioChunks=[];

async function startRecording(){

  const stream=
    await navigator.mediaDevices.getUserMedia({
      audio:true
    });

  mediaRecorder=
    new MediaRecorder(stream);

  mediaRecorder.start();
  audioChunks=[];

  mediaRecorder.ondataavailable=e=>{
    audioChunks.push(e.data);
  };

  mediaRecorder.onstop=()=>{

    const blob=new Blob(audioChunks,{
      type:"audio/mp3"
    });

    /*
     * Blob URLs are device-local and cannot be shared through Firebase.
     * Convert the recording to a data URL so another device can load it.
     */
    const reader=new FileReader();

    reader.onload=()=>{
      createMessage(
        `<audio controls><source src="${reader.result}" type="audio/mp3"></audio>`,
        "mine"
      );
    };

    reader.readAsDataURL(blob);

    stream.getTracks().forEach(track=>track.stop());
  };

  setTimeout(()=>{
    if(mediaRecorder && mediaRecorder.state==="recording"){
      mediaRecorder.stop();
    }
  },5000);
}

function downloadBackup(){

  const data=
    document.getElementById("chatArea").innerHTML;

  const blob=new Blob([data],{
    type:"text/html"
  });

  const a=document.createElement("a");

  a.href=URL.createObjectURL(blob);
  a.download="love-chat-backup.html";
  a.click();

  URL.revokeObjectURL(a.href);
}

/* ---------------- REACTION ---------------- */

function addReaction(el,reaction){

  const message=el.closest(".message");
  if(!message) return;

  const key=message.dataset.messageKey;

  /*
   * Keep the old visual behavior even if cloud storage is unavailable.
   */
  const result=message.querySelector(".reaction-result");

  const badge=document.createElement("div");
  badge.className="reaction-badge";
  badge.innerHTML=escapeHtml(reaction);
  result.appendChild(badge);

  if(cloudReady && key){
    messagesRef.child(key+"/reactions").push(reaction);
  }

  saveChat();
}

    Notification.permission==="granted"
  ){

    });
  }
}

if(
  "Notification" in window &&
  Notification.permission!=="granted"
){

}

/* ---------------- REPLY ---------------- */

let replyText="";

function replyMessage(text){

  replyText=text;

  msgInput.placeholder=
    "Replying: "+text.substring(0,25);
}

/* ---------------- HTML ESCAPE ---------------- */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
